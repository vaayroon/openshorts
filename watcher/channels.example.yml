# Copy to watcher/channels.yml (git-ignored) and edit. The watcher re-reads it
# on every run, so changes apply without a restart.

# OpenShorts records, for every job, that the submitter owns the content or
# has the rights to process it. The watcher submits unattended, so you confirm
# it here once for the channels listed below.
acknowledge_rights: false

# Most jobs submitted in any rolling 24 hours (each one spends Gemini quota).
max_jobs_per_day: 3

# How many of the watcher's jobs may run at once. With 1, the next stream
# waits until the previous one has finished (completed or failed).
max_in_flight: 1

# Options for every channel; any channel can override them.
defaults:
  # How a 16:9 stream becomes a 9:16 clip. Pick ONE base layout and optionally
  # add-ons, e.g. ["screencast"] or ["split", "speaker_cut"].
  # (docs/architecture/layouts-and-reframing.md has the full detail.)
  #
  # Base layouts (the dashboard's "vertical layout" menu):
  #
  #   auto        "Auto (AI picks per video)"
  #               One Gemini call per video (12 frames) chooses none,
  #               screencast or split, and two-person shots are checked scene
  #               by scene. It only adds layouts, never removes yours.
  #               Use it when a channel mixes formats or you are not sure.
  #
  #   split       "Two speakers stacked"
  #               Two people seen in the same frame become two halves, one
  #               above the other, with captions on the seam. Needs both faces
  #               in one frame; close-up-only shots stay a normal crop.
  #               Use it for podcasts and interviews filmed as a two-shot.
  #
  #   screencast  "Screen over presenter"
  #               Per shot, Gemini says whether it shows a screen. Screen shots
  #               go full width on top; a webcam laid in a corner (OBS, stream
  #               VODs) is enlarged underneath; fast gameplay is zoomed a bit
  #               and follows the motion. Camera-only shots keep a normal crop.
  #               Use it for gameplay or screen-share streams with a facecam.
  #
  #   none        "Single crop only"
  #               No AI layout: one vertical crop that follows the main face or
  #               subject. Steady and predictable, but it cuts off the sides.
  #               Use it for one person talking to camera, or when the others
  #               make mistakes on a channel.
  #
  # Add-ons (API only, not in the dashboard; test them on one video first):
  #
  #   speaker_cut Hard cuts to whoever is talking, judged from mouth movement.
  #               Use it with split (or auto) on podcasts where both people
  #               are on screen and you prefer cuts to a stacked frame.
  #
  #   punch_in    A ~12% zoom on the loud beats of the audio. Only affects
  #               single-person shots (the face-following crop).
  #               Use it for energetic talkers; skip it for gameplay.
  layouts: ["auto"]
  auto_hook: true
  # pill, classic, dark, yellow, red, outline, outline_yellow. Empty = pill.
  auto_hook_style: outline
  # Clips per stream (1-15). Empty = OpenShorts decides from the length.
  target_clips:
  # Clip length band in seconds. Empty = OpenShorts' own 15-60 s.
  # min 5-175, max 10-180, and max at least 5 s above min.
  clip_min_seconds:
  clip_max_seconds:
  # Streams shorter or longer than this are ignored.
  min_minutes: 20
  max_hours: 6

channels:
  - url: https://www.youtube.com/@channel-handle
  # - url: https://www.youtube.com/@another-channel
  #   layouts: ["screencast"]
  #   target_clips: 10
